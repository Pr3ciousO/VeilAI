[package]
name = "veilai"
version = "0.1.0"
description = "VeilAI — private, verifiable execution infrastructure for AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veilai"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control"] }
solana-instructions-sysvar = "3.0.1"
sha2 = "0.10"
